    <script>
      (function() {
        // Prevent "Cannot set property fetch of #<Window> which has only a getter"
        try {
          var originalFetch = window.fetch;
          var fetchHandler = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;

          function defineFetchProperty(target) {
            try {
              if (!target) return false;
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (desc && (desc.set || desc.writable)) {
                return true;
              }
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return fetchHandler;
                },
                set: function(val) {
                  fetchHandler = val;
                },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch (e) {
              return false;
            }
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchProperty(Window.prototype);
          }
          defineFetchProperty(window);
        } catch (e) {
          // ignore
        }

        // Global safeguard against unhandled errors for fetch setter in sandboxed iframes
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
