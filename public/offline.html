<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Yaswant Code</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      opacity: 0.9;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 1rem;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#10b981"/>
        <stop offset="100%" stop-color="#06b6d4"/>
      </linearGradient>
    </defs>
    <rect x="6" y="6" width="116" height="116" rx="28" fill="#0f172a" stroke="url(#g)" stroke-width="2.5"/>
    <path d="M 32 36 L 56 64 L 64 64 L 46 36 Z" fill="url(#g)"/>
    <path d="M 96 36 L 72 64 L 64 64 L 82 36 Z" fill="url(#g)"/>
    <rect x="58" y="60" width="12" height="38" rx="6" fill="url(#g)"/>
    <circle cx="64" cy="62" r="5" fill="#ffffff"/>
  </svg>

  <h1>You're Offline</h1>
  <p>No internet connection right now. Check your network and try again — your cached content is still available.</p>
  <button class="btn" onclick="window.location.reload()">Try Again</button>
  <p class="status" id="status">Waiting for connection...</p>

  <script>
    window.addEventListener('online', function() {
      document.getElementById('status').textContent = 'Connection restored! Redirecting...';
      setTimeout(function() { window.location.href = '/'; }, 800);
    });
    window.addEventListener('offline', function() {
      document.getElementById('status').textContent = 'Still offline.';
    });
  </script>
</body>
</html>
