<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b2a4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient glow circles -->
  <circle cx="200" cy="150" r="200" fill="#2563eb" opacity="0.06"/>
  <circle cx="1000" cy="480" r="250" fill="#7c3aed" opacity="0.07"/>

  <!-- Accent bar top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>

  <!-- Brand badge -->
  <rect x="80" y="80" width="14" height="14" rx="3" fill="url(#accentGrad)"/>
  <text x="104" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="2" text-transform="uppercase">YASWANT CODE</text>

  <!-- Live indicator -->
  <circle cx="1090" cy="88" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1102" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280">LIVE</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-2">Architect the Future</text>
  <text x="80" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" fill="#94a3b8" letter-spacing="-2">of Software &amp; AI.</text>

  <!-- Subtitle -->
  <text x="80" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#64748b">Full-Stack Engineering · AI/LLM Masterclasses · Verifiable Credentials</text>

  <!-- Divider line -->
  <rect x="80" y="430" width="80" height="3" rx="2" fill="url(#accentGrad)"/>

  <!-- Stats row -->
  <text x="80" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">140k+</text>
  <text x="80" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Active Engineers</text>

  <text x="280" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">197+</text>
  <text x="280" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Expert Courses</text>

  <text x="480" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#ffffff">6</text>
  <text x="480" y="520" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#64748b">Disciplines</text>

  <!-- CTA badge -->
  <rect x="700" y="380" width="420" height="180" rx="20" fill="#ffffff" opacity="0.04" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
  <text x="910" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#93c5fd" text-anchor="middle">START LEARNING FREE</text>
  <text x="910" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle">yaswant.co.in</text>
  <text x="910" y="515" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" text-anchor="middle">React 19 · Next.js 15 · LLM Engineering</text>

  <!-- Bottom accent -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
