<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Emerald to Cyan Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glow Gradient -->
    <radialGradient id="glowGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ambient Glow -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#glowGrad)" />

  <!-- The "Y" + Code Chevron Tech Monogram -->
  <g filter="url(#subtleGlow)">
    <!-- Left Bracket Wing: < angle pointing inward forming left upper Y -->
    <path d="M 32 36 L 56 64 L 64 64 L 46 36 Z" fill="url(#primaryGrad)" />

    <!-- Right Bracket Wing: > angle pointing inward forming right upper Y -->
    <path d="M 96 36 L 72 64 L 64 64 L 82 36 Z" fill="url(#primaryGrad)" />

    <!-- Center Vertical Stem: Base of the Y, sleek pillar -->
    <rect x="58" y="60" width="12" height="38" rx="6" fill="url(#primaryGrad)" />

    <!-- Central Apex Core Terminal Node -->
    <circle cx="64" cy="62" r="5" fill="#ffffff" />
    
    <!-- Code Bracket Accents: Sleek subtle code brackets flanking bottom stem -->
    <path d="M 36 68 L 28 77 L 36 86" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75" />
    <path d="M 92 68 L 100 77 L 92 86" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75" />
  </g>
</svg>
